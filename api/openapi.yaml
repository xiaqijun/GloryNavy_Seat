      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [corporation_id, project_id, version, request_key, name, enabled, reward_id, reward_version, coins_minor, claim_limit]
              properties:
                corporation_id: {type: string, pattern: '^[1-9][0-9]*$'}
                project_id: {type: string, pattern: '^[0-9]+$'}
                version: {type: string, pattern: '^[0-9]+$'}
                request_key: {type: string, format: uuid}
                name: {type: string, maxLength: 100}
                enabled: {type: boolean}
                reward_id: {type: string, pattern: '^[0-9]+$'}
                reward_version: {type: string, pattern: '^[0-9]+$'}
                coins_minor: {type: integer, format: int64, minimum: 0}
                claim_limit: {type: integer, format: int64, minimum: 0, maximum: 1000, description: Maximum claim batches per bound character; 0 means unlimited}
      responses:
        '200': {description: Saved welfare policy and immutable reward snapshot}
        '400': {description: Invalid project or reward selection}
        '401': {description: Login required}
        '403': {description: CSRF rejected}
        '404': {description: Site administrator or corporation scope required}
        '409': {description: Version or idempotency conflict}
  /api/v1/welfare/activity/applications:
    post:
      operationId: applyWelfareActivity
      summary: Member applies for a configured activity project for one or more bound characters
      description: Each repeated character_id must be currently bound to the signed-in account in the project corporation. A single string remains accepted for older clients. The optional description and contract_id are saved as application material. The server publishes one independent case per selected character, freezing the enabled policy version, library reward and separate coin amount into each welfare case. Images are copied to each case in publication and can be read only through the authorized case route. Each selected character consumes one claim batch independently; characters on the same account do not share the allowance. request_key plus character_id provides deterministic idempotency across batch retries.
      security: [{SessionCookie: []}]
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [corporation_id, project_id, character_id, request_key, images]
              properties:
                corporation_id: {type: string, pattern: '^[1-9][0-9]*$'}
                project_id: {type: string, pattern: '^[1-9][0-9]*$'}
                character_id: {type: array, minItems: 1, maxItems: 20, items: {type: string, pattern: '^[1-9][0-9]*$'}, description: Repeat this multipart field once per selected bound character}
                request_key: {type: string, format: uuid}
                description: {type: string, maxLength: 1000, description: Optional application notes}
                contract_id: {type: string, pattern: '^[1-9][0-9]*$', description: Optional personal contract ID saved as applicant-provided supporting material; it is not verified purchase or delivery evidence}
                images: {type: array, minItems: 1, maxItems: 3, items: {type: string, format: binary}, description: JPEG/PNG/WebP; maximum 2 MiB each}
      responses:
        '200': {description: Submitted welfare case for one character, or an object containing cases for a multi-character submission}
        '400': {description: Invalid application or image}
        '401': {description: Login required}
        '403': {description: CSRF rejected}
        '404': {description: Character or project unavailable}
        '409': {description: Policy changed or idempotency conflict}
