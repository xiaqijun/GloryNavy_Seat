      operationId: deleteSiteRole
      summary: Delete a role and its assignments; requires access.manage
      security: [{ SessionCookie: [] }]
      parameters:
        - {
            in: query,
            name: version,
            required: true,
            schema: { type: string, pattern: "^[1-9][0-9]*$" },
            description: Current role version,
          }
        - { $ref: "#/components/parameters/MutationOrigin" }
        - { $ref: "#/components/parameters/CSRFToken" }
      responses:
        "200": { $ref: "#/components/responses/AccessSaved" }
        "400": { $ref: "#/components/responses/InvalidAccessChange" }
        "409": { $ref: "#/components/responses/AccessConflict" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/AccessUnavailable" }
