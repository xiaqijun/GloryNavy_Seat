    put:
      operationId: saveSiteRole
      summary: Create or replace a role; requires access.manage
      security: [{ SessionCookie: [] }]
      parameters:
        - { $ref: "#/components/parameters/MutationOrigin" }
        - { $ref: "#/components/parameters/CSRFToken" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, grants, version]
              properties:
                version:
                  {
                    type: string,
                    pattern: "^(0|[1-9][0-9]*)$",
                    description: "0 to create; current version to update. Stale writes return 409.",
                  }
                name: { type: string, minLength: 1, maxLength: 80 }
