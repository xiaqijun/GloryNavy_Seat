                  data: {$ref: '#/components/schemas/SentryAlertUsageSummary'}
        '401': {description: No active session}
        '503': {description: Alert usage projection unavailable}
  /api/v1/sentry/alert-consumptions:
    get:
      operationId: sentryListAlertConsumptions
      summary: List the current account's alert coin consumption records
      description: Returns newest-first records with duration and the frozen coin pricing basis. Cursor pagination is stable by record ID.
      security: [{SessionCookie: []}]
      parameters:
        - name: before
          in: query
          schema: {type: string, pattern: '^[1-9][0-9]*$'}
        - name: state
          in: query
          schema: {type: string, enum: [reserved, settled, released, refunded]}
        - name: from
          in: query
          schema: {type: string, format: date-time}
        - name: to
          in: query
          schema: {type: string, format: date-time}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 30}
      responses:
        '200':
          description: Alert consumption page
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/SentryAlertConsumptionPage'}
        '400': {description: Invalid cursor, state, time range, or limit}
        '401': {description: No active session}
        '503': {description: Alert usage projection unavailable}
  /api/v1/sentry/alert-pricing:
    get:
      operationId: sentryReadAlertPricing
      summary: Read the current alert charging policy
      description: Returns the current price basis in Nutshell Coin minor units. Time fields explain pricing and grant limits; they are not a second wallet or total allowance. Site administrators receive can_edit=true.
      security: [{SessionCookie: []}]
      responses:
        '200':
          description: Current alert charging policy
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/SentryAlertPricing'}
        '401': {description: No active session}
        '503': {description: Pricing storage unavailable}
  /api/v1/sentry/time-pricing:
    get:
      operationId: sentryReadTimePricing
      summary: Read the two hourly Sentry prices
      description: Returns alert consumption and monitor reward prices in Nutshell Coin minor units and the persisted administrator charging switch.
      security: [{SessionCookie: []}]
      responses:
        '200':
          description: Current hourly prices
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/SentryTimePricing'}
        '401': {description: No active session}
    put:
      operationId: sentryUpdateTimePricing
      summary: Update the two hourly Sentry prices and charging switch
      description: Site administrators only. Version protects concurrent edits; the new prices apply from their save time and do not rewrite existing alert grants. Disabling charging blocks new alert grants while existing grants remain reconcilable.
      security: [{SessionCookie: []}]
      parameters:
        - {$ref: '#/components/parameters/CSRFToken'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SentryTimePricingEdit'}
      responses:
        '200':
          description: Hourly prices saved
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/SentryTimePricing'}
        '400': {description: Invalid price or switch values}
        '401': {description: No active session}
        '403': {description: Site administrator required}
        '409': {description: Pricing version conflict}
    put:
      operationId: sentryUpdateAlertPricing
      summary: Update the alert charging policy
      description: Site administrators only. The version is optimistic concurrency protection; the persisted policy applies to new grants and existing grants retain their frozen pricing snapshot. This endpoint does not enable the deployment charging switch.
      security: [{SessionCookie: []}]
      parameters:
        - {$ref: '#/components/parameters/CSRFToken'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SentryAlertPricingEdit'}
      responses:
        '200':
          description: Pricing policy saved
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/SentryAlertPricing'}
        '400': {description: Invalid pricing values}
        '401': {description: No active session}
        '403': {description: Site administrator required}
        '409': {description: Pricing version conflict}
        '503': {description: Pricing storage unavailable}
  /api/v1/sentry/alert-grants:
    post:
      operationId: sentryCreateAlertGrant
      summary: Reserve a prepaid time allowance for alert delivery
      description: Uses Seat's server-frozen price policy, reserves coins in exchange, and projects a v2 seconds-only grant to EVE Sentry. Pricing remains local to Seat; the request key is also the stable grant identifier for safe retry.
      security: [{SessionCookie: []}]
      parameters:
        - {$ref: '#/components/parameters/CSRFToken'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SentryAlertGrantCreate'}
      responses:
        '201':
          description: Time allowance created and projected to Sentry
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties: {data: {$ref: '#/components/schemas/SentryAlertGrant'}}
        '400': {description: Invalid key, duration, or request key}
        '401': {description: No active session}
        '404': {description: Key not found or not owned by the current account}
        '409': {description: Key state or idempotency conflict}
        '503': {description: Alert charging is disabled or Sentry is unavailable}
  /api/v1/sentry/alert-grants/{id}:
    delete:
      operationId: sentryRevokeAlertGrant
      summary: Revoke an alert time allowance and release unused coins
      security: [{SessionCookie: []}]
      parameters:
        - {$ref: '#/components/parameters/CSRFToken'}
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [request_key]
              properties: {request_key: {type: string, format: uuid}}
      responses:
        '200':
          description: Allowance revoked and unused reservation released
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [revoked]
                    properties: {revoked: {type: boolean, enum: [true]}}
        '400': {description: Invalid grant or request key}
        '401': {description: No active session}
        '404': {description: Grant not found or not owned by the current account}
        '409': {description: Grant has unresolved reserved intervals}
        '503': {description: Alert charging is disabled or Sentry is unavailable}

components:
  parameters:
    CharacterID:
      in: path
      name: id
      required: true
      schema: { type: string, pattern: "^[1-9][0-9]*$" }
    MutationOrigin:
      in: header
      name: Origin
      required: true
      schema: { type: string }
      description: Must exactly match PUBLIC_ORIGIN
    CSRFToken:
      in: header
      name: X-CSRF-Token
      required: true
      schema: { type: string }
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: gn_session
  responses:
    CommunityProfile:
      description: Own account-level details and independent completeness/confirmation states
      content:
        application/json:
          schema:
            type: object
            required: [data, request_id]
            properties:
              request_id: { type: string }
              data: { $ref: "#/components/schemas/CommunityProfile" }
    CommunityUnavailable:
      description: Community profile storage unavailable
      content:
        { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    CharacterSaved:
      description: Character operation committed
      content:
        application/json:
          schema:
            type: object
            required: [data, request_id]
            properties:
              request_id: { type: string }
              data:
                type: object
                required: [updated]
                properties:
                  updated: { type: boolean, enum: [true] }
    CharacterFlow:
      description: Browser-bound flow created; navigate to the returned CCP URL
      content:
        application/json:
          schema:
            type: object
            required: [data, request_id]
            properties:
              request_id: { type: string }
              data:
                type: object
                required: [url]
                properties:
                  url: { type: string, format: uri }
    CharacterRateLimit:
      description: Too many SSO starts; shared with ordinary login
      headers:
        Retry-After: { schema: { type: string } }
      content:
        { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    CharacterUnavailable:
      description: Identity/ESI flow service unavailable or not configured
      content:
        { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    InvalidCharacter:
      description: Invalid identifier or character unavailable to this user
      content:
        { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Unauthenticated:
      description: No active session
      content:
        { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Forbidden:
      description: Permission, entity scope, Origin or CSRF check failed; with community enabled, protected business operations also return profile_required until both details are complete. Session/character management, own access summary and community profile operations remain available; community confirmation is not a gate.
      content:
        { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    AccessUnavailable:
      description: Authorization database or fresh target snapshot unavailable
      content:
        { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    InvalidAccessChange:
      description: Invalid role, identifier, grant, filter or assignment
      content:
        { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    AccessConflict:
      description: Role version changed or role no longer exists. Reload before retrying; failed mutations are not audited.
      content:
        { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    AccessSaved:
      description: Change committed with an audit record
      content:
        application/json:
          schema:
            type: object
            required: [data, request_id]
            properties:
              request_id: { type: string }
              data:
                type: object
                required: [saved]
                properties:
                  saved: { type: boolean, enum: [true] }
    Ready:
      description: PostgreSQL is reachable and foundation schema is compatible
      headers:
        X-Request-ID:
          description: Server-generated correlation ID
          schema: { type: string }
      content:
        application/json:
          schema:
            type: object
            required: [data, request_id]
            properties:
              request_id: { type: string }
              data: { $ref: "#/components/schemas/SystemStatus" }
    Unavailable:
      description: Database unavailable, missing migration, or incompatible schema
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    SentryKeyCreate:
      type: object
      additionalProperties: false
      required: [name, permissions, request_key]
      properties:
        name: {type: string, minLength: 1, maxLength: 80}
        permissions:
          type: array
          minItems: 1
          maxItems: 2
          uniqueItems: true
          items: {type: string, enum: [monitor, alert]}
        request_key: {type: string, format: uuid}
    SentryKey:
      type: object
      additionalProperties: false
      required: [id, name, prefix, permissions, status, version, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        prefix: {type: string}
        permissions:
          type: array
          items: {type: string, enum: [monitor, alert]}
        status: {type: string, enum: [creating, active, revoking, revoked, sync_error]}
        remote_key_id: {type: string}
        version: {type: integer, format: int64, minimum: 0}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        revoked_at: {type: string, format: date-time}
        last_error: {type: string}
        secret: {type: string, readOnly: true, description: Full secret is returned to the owning account by create, rotate and protected list responses when encrypted plaintext is available. Legacy hash-only keys require one manual rotation.}
    SentryKeyList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/SentryKey'}
    SentryAlertGrantCreate:
      type: object
      additionalProperties: false
      required: [key_id, reserved_seconds, request_key]
      properties:
        key_id: {type: string, format: uuid}
        reserved_seconds: {type: integer, format: int64, minimum: 1}
        request_key: {type: string, format: uuid}
    SentryAlertUsageSummary:
      type: object
      additionalProperties: false
      required: [available_minor, alert_reserved_minor, alert_settled_minor, alert_released_minor, alert_refunded_minor, monitor_reward_minor, as_of]
      properties:
        available_minor: {type: integer, format: int64, description: Available Nutshell Coins; may be negative while a deficit is being covered.}
        alert_reserved_minor: {type: integer, format: int64, minimum: 0, description: Coins currently held for alert intervals.}
        alert_settled_minor: {type: integer, format: int64, minimum: 0, description: Net settled alert consumption.}
        alert_released_minor: {type: integer, format: int64, minimum: 0, description: Coins released from unused alert reservations.}
        alert_refunded_minor: {type: integer, format: int64, minimum: 0, description: Coins refunded for settled alert intervals.}
        monitor_reward_minor: {type: integer, format: int64, minimum: 0, description: Coins credited from server-confirmed monitor time.}
        as_of: {type: string, format: date-time}
    SentryTimePricing:
      type: object
      additionalProperties: false
      required: [alert_hourly_price_minor, monitor_hourly_reward_minor, version, can_edit, charging_enabled]
      properties:
        alert_hourly_price_minor: {type: integer, format: int64, minimum: 0, maximum: 1000000000000}
        monitor_hourly_reward_minor: {type: integer, format: int64, minimum: 0, maximum: 1000000000000}
        version: {type: integer, format: int64, minimum: 0}
        can_edit: {type: boolean}
        charging_enabled: {type: boolean, description: Persisted administrator switch; false by default.}
        updated_at: {type: string, format: date-time}
    SentryTimePricingEdit:
      type: object
      additionalProperties: false
      required: [alert_hourly_price_minor, monitor_hourly_reward_minor, version, charging_enabled]
      properties:
        alert_hourly_price_minor: {type: integer, format: int64, minimum: 1, maximum: 1000000000000}
        monitor_hourly_reward_minor: {type: integer, format: int64, minimum: 0, maximum: 1000000000000}
        version: {type: integer, format: int64, minimum: 0}
        charging_enabled: {type: boolean, description: Persisted administrator switch.}
    SentryAlertPricing:
      type: object
      additionalProperties: false
      required: [price_version, unit_seconds, unit_price_minor, max_grant_seconds, grant_ttl_seconds, version, configured, charging_enabled, can_edit]
      properties:
        price_version: {type: string, description: Price policy version; empty only when no deployment or administrator policy is configured.}
        unit_seconds: {type: integer, format: int64, minimum: 0, maximum: 86400, description: Seconds represented by one price unit. Zero is returned only before a policy exists while charging is disabled.}
        unit_price_minor: {type: integer, format: int64, minimum: 0, maximum: 1000000000000, description: Nutshell Coin minor units per price unit.}
        max_grant_seconds: {type: integer, format: int64, minimum: 0, maximum: 2678400}
        grant_ttl_seconds: {type: integer, format: int64, minimum: 0, maximum: 2678400}
        version: {type: integer, format: int64, minimum: 0, description: Optimistic concurrency version; zero means no persisted policy yet.}
        configured: {type: boolean, description: True when the administrator has saved a persisted policy.}
        charging_enabled: {type: boolean, description: Persisted administrator switch state.}
        can_edit: {type: boolean, description: True only for a site administrator.}
        updated_at: {type: string, format: date-time}
    SentryAlertPricingEdit:
      type: object
      additionalProperties: false
      required: [price_version, unit_seconds, unit_price_minor, max_grant_seconds, grant_ttl_seconds, version]
      properties:
        price_version: {type: string, minLength: 1, maxLength: 80}
        unit_seconds: {type: integer, format: int64, minimum: 1, maximum: 86400}
        unit_price_minor: {type: integer, format: int64, minimum: 1, maximum: 1000000000000}
        max_grant_seconds: {type: integer, format: int64, minimum: 1, maximum: 2678400}
        grant_ttl_seconds: {type: integer, format: int64, minimum: 60, maximum: 2678400}
        version: {type: integer, format: int64, minimum: 0}
    SentryAlertConsumption:
      type: object
      additionalProperties: false
      required: [id, grant_id, interval_id, started_at, ended_at, duration_seconds, coins_minor, state, unit_seconds, unit_price_minor, expires_at]
      properties:
        id: {type: string, pattern: '^[1-9][0-9]*$'}
        grant_id: {type: string, format: uuid}
        interval_id: {type: string}
        started_at: {type: string, format: date-time}
        ended_at: {type: string, format: date-time}
        duration_seconds: {type: integer, format: int64, minimum: 1}
        coins_minor: {type: integer, format: int64, minimum: 1}
        state: {type: string, enum: [reserved, settled, released, refunded]}
        unit_seconds: {type: integer, format: int64, minimum: 1}
        unit_price_minor: {type: integer, format: int64, minimum: 1}
        price_version: {type: string}
        expires_at: {type: string, format: date-time}
    SentryAlertConsumptionPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor, as_of]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/SentryAlertConsumption'}}
        next_cursor: {type: string, description: Empty when there is no older page.}
        as_of: {type: string, format: date-time}
