        expires_at: {type: string, format: date-time}
        status: {type: string, enum: [active, revoked, exhausted, expired]}
        protocol_version: {type: integer, enum: [1, 2], description: Downstream grant protocol; v2 carries seconds and expiry only, while the price fields remain Seat-owned snapshots.}
