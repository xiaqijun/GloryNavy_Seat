      operationId: getSystemStatus
      summary: Read system status (current site administrators only)
      security: [{SessionCookie: []}]
      responses:
        "200": { $ref: "#/components/responses/Ready" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/v1/modules:
    get:
      operationId: getModuleCatalog
      summary: List enabled compiled-in modules in dependency order
      security: [{SessionCookie: []}]
      description: Authenticated module capability metadata. Navigation visibility is not authorization. Includes no credentials or permission grants.
      responses:
        "200":
          description: Active module catalog; does not query PostgreSQL
          content:
            application/json:
              schema:
                type: object
                required: [data, request_id]
                properties:
                  request_id: { type: string }
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/ModuleInfo" }
  /api/v1/eve/login-status:
    get:
      operationId: getPublicEVELoginStatus
      security: []
      summary: Minimal anonymous sign-in availability
      responses:
        "200":
          description: Configuration presence only
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    additionalProperties: false
                    required: [configured]
                    properties:
                      configured: {type: boolean}
                  request_id: {type: string}
  /api/v1/eve/status:
    get:
      operationId: getEVEStatus
      security: [{SessionCookie: []}]
      summary: Check whether EVE application credentials are configured
      responses:
        "200":
          description: Configuration presence only; does not verify credentials with CCP
          content:
            application/json:
              schema:
                type: object
                required: [data, request_id]
                properties:
                  request_id: { type: string }
                  data:
                    type: object
                    required: [configured, corporation_roles, scopes]
                    properties:
                      configured: { type: boolean }
                      corporation_roles:
                        {
                          type: boolean,
                          description: Whether login requests the character corporation-role scope,
                        }
                      scopes:
                        {
                          type: array,
                          items: { type: string },
                          description: Requested OAuth scope profile,
                        }
  /api/v1/eve/login:
    post:
      operationId: startEVELogin
      summary: Start a browser-bound, single-use EVE SSO authorization with PKCE
      description: Submit a same-origin HTML form. Requires an exact PUBLIC_ORIGIN Origin header. With access enabled, requests the 57-scope SeAT-compatible profile and binds it to the single-use flow. Sets a short-lived HttpOnly SameSite=Lax flow cookie.
      parameters:
        - in: header
          name: Origin
          required: true
          schema: { type: string }
      responses:
        "303":
          description: Redirect to EVE SSO, or a sanitized local login error page
          headers:
            Location:
              schema: { type: string }
        "403":
          description: Cross-origin or missing-origin request rejected
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: Login initiation rate limit reached
          headers:
            Retry-After:
              schema: { type: string }
  /api/v1/eve/callback:
    get:
      operationId: completeEVELogin
      summary: Exchange and validate EVE authorization, then create a local session
      description: Validates browser cookie, prior session binding, one-time state and requested scopes. Ordinary login creates/rotates a session without implicitly linking. Link/reauthorize require the original live user session, reauthorization also requires the expected character. Identity and credentials commit atomically. Success redirects to /account; validated member-flow errors redirect to /account, login/invalid-state errors to /login, with fixed sanitized codes. Link/reauthorize retain the original login character and session expiry. EVE tokens never appear in the response.
      parameters:
        - in: query
          name: state
          required: true
          schema: { type: string, maxLength: 128 }
        - in: query
          name: code
          schema: { type: string, maxLength: 4096 }
        - in: query
          name: error
          schema: { type: string }
      responses:
        "303":
          description: Local redirect; successful login sets an HttpOnly SameSite=Lax session cookie (Secure on HTTPS)
          headers:
            Location:
              schema: { type: string }
  /api/v1/identity/session:
    get:
      operationId: getCurrentSession
      summary: Return the current local identity or explicit anonymous state
      description: A private no-store response. The CSRF token is for same-origin mutations; it is not an EVE token or session credential. Invalid/expired/blocked sessions return authenticated=false. Database failures with an incoming session return 503.
      responses:
        "200":
          description: Anonymous or authenticated session
          content:
            application/json:
              schema:
                type: object
                required: [data, request_id]
                properties:
                  request_id: { type: string }
                  data:
                    type: object
                    required: [authenticated, session]
                    properties:
                      authenticated: { type: boolean }
                      session:
                        $ref: "#/components/schemas/Session"
        "503": { $ref: "#/components/responses/CharacterUnavailable" }
  /api/v1/community/profile:
    get:
      operationId: getOwnCommunityProfile
      summary: Read QQ and KOOK details for the authenticated site user
      description: Requires community module. Empty profiles return version 0 and unfilled states. Alternate characters share the same profile. Member-supplied details do not confirm platform identity or community membership.
      security: [{ SessionCookie: [] }]
      responses:
        "200": { $ref: "#/components/responses/CommunityProfile" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "503": { $ref: "#/components/responses/CommunityUnavailable" }
    put:
      operationId: updateOwnCommunityProfile
      summary: Save both QQ number and KOOK nickname using an optimistic profile revision
      description: Body limit 4096 bytes; unknown fields rejected. User comes from the session, never the body. Trims both values; QQ requires 5-12 ASCII digits without leading zero, KOOK requires 1-64 Unicode code points without control characters. These are local input rules. Changed fields increment their revisions and invalidate only their platform's previous confirmation; unchanged saves preserve confirmations and revisions. Details are not unique ownership evidence and never merge users. Members cannot set confirmation fields.
      security: [{ SessionCookie: [] }]
      parameters:
        - { $ref: "#/components/parameters/MutationOrigin" }
        - { $ref: "#/components/parameters/CSRFToken" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [qq_number, kook_name, version]
              properties:
                qq_number:
                  {
                    type: string,
                    description: QQ number,
                    trimmed and validated by local input rules,
                  }
                kook_name:
                  {
                    type: string,
                    description: KOOK nickname,
                    trimmed and validated by local input rules,
                  }
                version:
                  {
                    type: string,
                    pattern: "^(0|[1-9][0-9]*)$",
                    description: Revision from the last GET; 0 for an empty profile,
                  }
      responses:
        "200": { $ref: "#/components/responses/CommunityProfile" }
        "400":
          description: invalid_profile, invalid_qq or invalid_kook
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/Error" } },
            }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: profile_conflict; stale or invalid revision, reload before resubmitting
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/Error" } },
            }
        "503": { $ref: "#/components/responses/CommunityUnavailable" }
  /api/v1/community/qq/challenge:
    post:
      operationId: createQQOfficialBindingChallenge
      summary: Create a short-lived code for binding the official QQ bot account
      description: The authenticated member enters the returned one-time code in a private message to the official QQ bot. The code is valid for ten minutes and is never stored in plaintext.
      security: [{ SessionCookie: [] }]
      parameters:
        - { $ref: "#/components/parameters/MutationOrigin" }
        - { $ref: "#/components/parameters/CSRFToken" }
      responses:
        "200":
          description: Challenge created
          content:
            application/json:
              schema:
                type: object
                required: [data, request_id]
                properties:
                  request_id: { type: string }
                  data:
                    type: object
                    required: [code, expires_at]
                    properties:
                      code: { type: string, pattern: "^[A-Z2-9]{8}$" }
                      expires_at: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: QQ number is not filled in, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "503": { $ref: "#/components/responses/CommunityUnavailable" }
  /api/v1/community/qq/group/application:
    post:
      operationId: createQQGroupApplication
      summary: Create an official QQ group admission application
      description: Creates a short-lived, one-time code for the signed-in site account. The member places the code in the official QQ group join verification message or review answer. The server approves only a configured bot-scoped group and binds the membership after GROUP_MEMBER_ADD; a numeric QQ group number is not accepted.
      security: [{ SessionCookie: [] }]
      parameters:
        - { $ref: "#/components/parameters/MutationOrigin" }
        - { $ref: "#/components/parameters/CSRFToken" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                group_openid: { type: string, maxLength: 256, description: "Optional when exactly one group is configured; this is the bot-scoped Group OpenID." }
      responses:
        "201":
          description: Application created
          content:
            application/json:
              schema:
                type: object
                required: [data, request_id]
                properties:
                  request_id: { type: string }
                  data: { $ref: "#/components/schemas/QQGroupApplicationChallenge" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: QQ number missing or an active application already exists, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "503": { $ref: "#/components/responses/CommunityUnavailable" }
    get:
      operationId: getQQGroupApplication
      summary: Read the signed-in member's latest QQ group application
      security: [{ SessionCookie: [] }]
      responses:
        "200":
          description: Latest application, or null when none exists
          content:
            application/json:
              schema:
                type: object
                required: [data, request_id]
                properties:
                  request_id: { type: string }
                  data:
                    nullable: true
                    allOf: [{ $ref: "#/components/schemas/QQGroupApplication" }]
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/CommunityUnavailable" }
  /api/v1/community/qq/group/applications:
    get:
      operationId: listQQGroupApplications
      summary: List QQ group admission applications for administrators
      description: Reads audit metadata only. The member's numeric QQ number and bot-scoped OpenIDs are included for matching; no bot credentials are returned.
      security: [{ SessionCookie: [] }]
      parameters:
        - { name: group_openid, in: query, required: false, schema: { type: string, maxLength: 256 } }
        - { name: status, in: query, required: false, schema: { type: string, enum: [pending, approving, approved, bound, rejected, expired, failed] } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 100 } }
      responses:
        "200":
          description: Applications ordered by creation time descending
          content:
            application/json:
              schema:
                type: object
                required: [data, request_id]
                properties:
                  request_id: { type: string }
                  data:
                    type: object
                    required: [items]
                    properties:
                      items: { type: array, items: { $ref: "#/components/schemas/QQGroupApplication" } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/CommunityUnavailable" }
  /api/v1/community/qq/group/options:
    get:
      operationId: listQQGroupOptions
      summary: List enabled QQ group admission options
      description: Returns only enabled bot-scoped groups and administrator display labels so a signed-in member can choose a target group for an admission application.
      security: [{ SessionCookie: [] }]
      responses:
        "200":
          description: Enabled group options
          content:
            application/json:
              schema:
                type: object
                required: [data, request_id]
                properties:
                  request_id: { type: string }
                  data:
                    type: object
                    required: [items]
                    properties:
                      items: { type: array, items: { $ref: "#/components/schemas/QQGroupSetting" } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/CommunityUnavailable" }
  /api/v1/community/qq/group/sync:
    post:
      operationId: syncQQGroupApplications
      summary: Poll configured QQ groups for pending admission requests
      description: Administrator-only fallback when an official GROUP_JOIN_REQUEST callback was delayed or not delivered. Each configured bot-scoped group is paged through the official join_request_list endpoint; matching verification codes are approved idempotently.
      security: [{ SessionCookie: [] }]
      parameters:
        - { $ref: "#/components/parameters/MutationOrigin" }
        - { $ref: "#/components/parameters/CSRFToken" }
      responses:
        "200": { description: Poll completed }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/CommunityUnavailable" }
  /api/v1/community/qq/group/settings:
    get:
      operationId: getQQGroupSettings
      summary: Read administrator-managed official QQ group settings
      description: Returns bot-scoped group OpenIDs and optional display labels. App credentials are never returned. Before an administrator saves settings, the server reports the environment bootstrap list.
      security: [{ SessionCookie: [] }]
      responses:
        "200":
          description: Current group allow-list
          content:
            application/json:
              schema:
                type: object
                required: [data, request_id]
                properties:
                  request_id: { type: string }
                  data: { $ref: "#/components/schemas/QQGroupSettings" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/CommunityUnavailable" }
    put:
      operationId: saveQQGroupSettings
      summary: Replace administrator-managed official QQ group settings
      description: Replaces the allow-list transactionally and applies enabled groups to admission callbacks. Group OpenIDs are bot-scoped values, not numeric QQ group numbers. Bot credentials are managed by the separate Bot settings endpoint and the secret is never returned.
      security: [{ SessionCookie: [] }]
      parameters:
        - { $ref: "#/components/parameters/MutationOrigin" }
        - { $ref: "#/components/parameters/CSRFToken" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [items]
              properties:
                items:
                  type: array
                  maxItems: 100
                  items: { $ref: "#/components/schemas/QQGroupSetting" }
      responses:
        "200":
          description: Settings saved
          content:
            application/json:
              schema:
                type: object
                required: [data, request_id]
                properties:
                  request_id: { type: string }
                  data: { $ref: "#/components/schemas/QQGroupSettings" }
        "400": { description: Invalid group settings, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/CommunityUnavailable" }
  /api/v1/community/qq/bot/settings:
    get:
      operationId: getQQBotSettings
      summary: Read administrator-managed official QQ Bot settings
      description: Returns the App ID and API origin plus a boolean secret status. The App Secret is write-only and is never returned.
      security: [{ SessionCookie: [] }]
      responses:
        "200":
          description: Current QQ Bot settings
          content:
            application/json:
              schema:
                type: object
                required: [data, request_id]
                properties:
                  request_id: { type: string }
                  data: { $ref: "#/components/schemas/QQBotSettings" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/CommunityUnavailable" }
    put:
      operationId: saveQQBotSettings
      summary: Replace administrator-managed official QQ Bot settings
      description: Saves the App ID and HTTPS API origin, encrypts the App Secret server-side and applies the configuration immediately. An empty secret keeps the existing secret; an empty App ID disables the bot and clears it.
      security: [{ SessionCookie: [] }]
      parameters:
        - { $ref: "#/components/parameters/MutationOrigin" }
        - { $ref: "#/components/parameters/CSRFToken" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [app_id, api_base, secret]
              properties:
                app_id: { type: string, maxLength: 128 }
                api_base: { type: string, maxLength: 256, format: uri }
                secret: { type: string, maxLength: 512, description: Write-only; an empty value retains the current secret }
      responses:
        "200":
          description: Settings saved
          content:
            application/json:
              schema:
                type: object
                required: [data, request_id]
                properties:
                  request_id: { type: string }
                  data: { $ref: "#/components/schemas/QQBotSettings" }
        "400": { description: Invalid QQ Bot settings, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/CommunityUnavailable" }
  /api/v1/community/qq/official/webhook:
    post:
      operationId: receiveOfficialQQBotWebhook
      summary: Receive the official QQ open platform callback
      description: Public endpoint for the official QQ Bot API v2. It handles the unsigned op=13 validation handshake, verifies X-Signature-Ed25519 on normal callbacks, accepts legacy C2C_MESSAGE_CREATE or GROUP_AT_MESSAGE_CREATE binding commands, and processes GROUP_JOIN_REQUEST plus GROUP_MEMBER_ADD for configured groups. Official events supply bot-scoped OpenID values; they do not expose the numeric QQ number.
      security: []
      parameters:
        - name: X-Signature-Timestamp
          in: header
          required: false
          schema: { type: string }
        - name: X-Signature-Ed25519
          in: header
          required: false
          schema: { type: string, pattern: "^[0-9a-fA-F]{128}$" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "200": { description: Official validation response or callback acknowledgement }
        "400": { description: Invalid callback payload, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { description: Invalid or expired callback signature, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "503": { description: Official QQ bot is not configured, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /api/v1/identity/characters:
    get:
      operationId: listOwnCharacters
      summary: List the current user's bound characters, main first
      security: [{ SessionCookie: [] }]
      responses:
        "200":
          description: Includes active and blocked bindings; no EVE credentials
          content:
            application/json:
              schema:
                type: object
                required: [data, request_id]
                properties:
                  request_id: { type: string }
                  data:
                    type: object
                    required: [characters]
                    properties:
                      characters:
                        {
                          type: array,
                          items:
                            { $ref: "#/components/schemas/BoundCharacter" },
                        }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "503": { $ref: "#/components/responses/CharacterUnavailable" }
  /api/v1/identity/characters/{id}/main:
    post:
      operationId: setMainCharacter
      summary: Select an active character owned by the authenticated user as main
      description: Changes display/default character only. Does not rewrite the authenticating character, user ID or site grants. Rechecks the live session inside the transaction and writes an audit event.
      security: [{ SessionCookie: [] }]
      parameters:
        - { $ref: "#/components/parameters/CharacterID" }
        - { $ref: "#/components/parameters/MutationOrigin" }
        - { $ref: "#/components/parameters/CSRFToken" }
      responses:
        "200": { $ref: "#/components/responses/CharacterSaved" }
        "400": { $ref: "#/components/responses/InvalidCharacter" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/InvalidCharacter" }
        "503": { $ref: "#/components/responses/CharacterUnavailable" }
  /api/v1/identity/characters/{id}:
    delete:
      operationId: unlinkCharacter
      summary: Unlink an owned alternate character
      description: Main characters require another main first. The last active login character cannot be removed. Atomically deletes its sessions, local ESI credentials and snapshots, clears pending member flows and records an audit event. Other characters and site grants remain. Unlinking the authenticating character ends that session. This removes local access and is not a remote CCP token-revocation request.
      security: [{ SessionCookie: [] }]
      parameters:
        - { $ref: "#/components/parameters/CharacterID" }
        - { $ref: "#/components/parameters/MutationOrigin" }
        - { $ref: "#/components/parameters/CSRFToken" }
      responses:
        "200": { $ref: "#/components/responses/CharacterSaved" }
        "400": { $ref: "#/components/responses/InvalidCharacter" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/InvalidCharacter" }
        "409":
          description: main_character or last_character protection
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/Error" } },
            }
        "503": { $ref: "#/components/responses/CharacterUnavailable" }
  /api/v1/eve/characters/link:
    post:
      operationId: startCharacterLink
      summary: Explicitly authorize another character for the current user
      description: Returns the CCP authorization URL for top-level navigation and sets a 10-minute flow cookie. Persists link intent and target user server-side. Binding to another site user is a conflict, never a merge. Same-user duplicate linking refreshes credentials without changing main or authentication identity.
      security: [{ SessionCookie: [] }]
      parameters:
        - { $ref: "#/components/parameters/MutationOrigin" }
        - { $ref: "#/components/parameters/CSRFToken" }
      responses:
        "200": { $ref: "#/components/responses/CharacterFlow" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/CharacterRateLimit" }
        "503": { $ref: "#/components/responses/CharacterUnavailable" }
  /api/v1/eve/characters/{id}/reauthorize:
    post:
      operationId: startCharacterReauthorization
      summary: Renew authorization for one owned active character
      description: Pins the expected character to a one-use flow using the current scope profile. Selecting another character at CCP returns wrong_character without creating a user, binding or credential. Original session, owner hash and requested scopes are rechecked.
      security: [{ SessionCookie: [] }]
      parameters:
        - { $ref: "#/components/parameters/CharacterID" }
        - { $ref: "#/components/parameters/MutationOrigin" }
        - { $ref: "#/components/parameters/CSRFToken" }
      responses:
        "200": { $ref: "#/components/responses/CharacterFlow" }
        "400": { $ref: "#/components/responses/InvalidCharacter" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/InvalidCharacter" }
        "429": { $ref: "#/components/responses/CharacterRateLimit" }
        "503": { $ref: "#/components/responses/CharacterUnavailable" }
  /api/v1/identity/logout:
    post:
      operationId: logout
      summary: Revoke the current database session and clear browser cookies
      security:
        - SessionCookie: []
      parameters:
        - in: header
          name: Origin
          required: true
          schema: { type: string }
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Session revoked and cookies cleared
          content:
            application/json:
              schema:
                type: object
                required: [data, request_id]
                properties:
                  request_id: { type: string }
                  data:
                    type: object
                    required: [logged_out]
                    properties:
                      logged_out: { type: boolean, enum: [true] }
        "401":
          description: No active session
        "403":
          description: Invalid origin or CSRF token
        "503":
          description: Session lookup or revocation failed
  /api/v1/access/me:
    get:
      operationId: getOwnAuthorization
      summary: Current user's site roles and corporation-role facts
      security: [{ SessionCookie: [] }]
      responses:
        "200":
          description: Token-free authorization state; game role freshness is checked server-side
          content:
            application/json:
              schema:
                type: object
                required: [data, request_id]
                properties:
                  request_id: { type: string }
