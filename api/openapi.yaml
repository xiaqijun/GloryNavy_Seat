                            "enum":
                              [
                                "training",
                                "scheduled",
                                "paused",
                                "awaiting_sync",
                                "completed",
                              ],
                          },
                      },
                    "required":
                      [
                        "id",
                        "name",
                        "position",
                        "level",
                        "start",
                        "finish",
                        "state",
                      ],
                    "additionalProperties": false,
                  },
              },
            "total_sp":
              { "type": "integer", "format": "int64", "nullable": true },
            "unallocated_sp":
              { "type": "integer", "format": "int64", "nullable": true },
            "calculated_at":
              { "type": "string", "format": "date-time", "nullable": true },
          },
        "required":
          [
            "skills_meta",
            "queue_meta",
            "skills",
            "queue",
            "total_sp",
            "unallocated_sp",
            "calculated_at",
          ],
        "additionalProperties": false,
      }
    SkillReport:
      {
        "type": "object",
        "properties":
          {
            "items":
              {
                "type": "array",
                "items":
                  {
                    "type": "object",
                    "properties":
                      {
                        "character":
                          { "$ref": "#/components/schemas/SkillCharacter" },
                        "state":
                          {
                            "type": "string",
                            "enum": ["met", "missing", "unknown"],
                          },
                        "met": { "type": "integer" },
                        "total": { "type": "integer" },
                        "remaining_sp": { "type": "integer", "format": "int64", "nullable": true, "minimum": 0, "description": "Sum of requirement SP deficits from authorized observations. Null if any deficit is unknown; zero when met. Unallocated SP is not deducted." },
                        "observed_at":
                          {
                            "type": "string",
                            "format": "date-time",
                            "nullable": true,
                          },
                        "checks":
                          {
                            "type": "array",
                            "items":
                              {
                                "type": "object",
                                "properties":
                                  {
                                    "skill_id":
                                      {
                                        "type": "string",
                                        "pattern": "^[1-9][0-9]*$",
                                      },
                                    "name": { "type": "string" },
                                    "required": { "type": "integer" },
                                    "remaining_sp": { "type": "integer", "format": "int64", "nullable": true, "minimum": 0, "description": "Ceiling of the SDE rank-based target minus observed skill SP (at least the confirmed trained-level minimum). Null on missing/conflicting data; zero when met." },
                                    "trained":
                                      {
                                        "type": "integer",
                                        "format": "int64",
                                        "nullable": true,
                                      },
                                    "state":
                                      {
                                        "type": "string",
                                        "enum": ["met", "missing", "unknown"],
                                      },
                                  },
                                "required":
                                  [
                                    "skill_id",
                                    "name",
                                    "required",
                                    "trained",
                                    "remaining_sp",
                                    "state",
                                  ],
                                "additionalProperties": false,
                              },
                          },
                      },
                    "required":
                      [
                        "character",
                        "state",
                        "met",
                        "total",
                        "remaining_sp",
                        "observed_at",
                        "checks",
                      ],
                    "additionalProperties": false,
                  },
              },
            "next_cursor": { "type": "string" },
          },
        "required": ["items", "next_cursor"],
        "additionalProperties": false,
      }

    PhysicalRewardContent:
      type: object
      additionalProperties: false
      required: [fittings, items]
      description: Fitted ships, ordinary items, PLEX and optional ISK; at least one positive component. Site coins are excluded. Names and complete fits are server-owned.
      properties:
        isk_minor: {type: integer, format: int64, minimum: 0, maximum: 100000000000000, default: 0, description: Frozen hundredths of ISK; zero or at least 100, with whole-ISK contract payment rounded down}
        fittings:
          type: array
          maxItems: 10
          items:
            type: object
            required: [fitting_id, quantity]
            properties:
              fitting_id: {type: string, pattern: '^[1-9][0-9]*$'}
              quantity: {type: integer, minimum: 1, maximum: 100}
              name: {type: string, readOnly: true}
              ship_type_id: {type: string, readOnly: true}
              corporation_id: {type: string, readOnly: true}
              version: {type: string, readOnly: true}
              fit: {type: object, readOnly: true}
        items:
          type: array
          maxItems: 30
          items:
            type: object
            required: [type_id, quantity]
            properties:
              type_id: {type: string, pattern: '^[1-9][0-9]*$'}
              quantity: {type: integer, minimum: 1, maximum: 1000000}
              name: {type: string, readOnly: true}
    RewardLibraryEntry:
      type: object
      required: [id, version, name, archived, content]
      properties:
        id: {type: string, pattern: '^[0-9]+$', description: Zero on creation}
        version: {type: string, pattern: '^[0-9]+$', description: Library content version; zero on creation}
        name: {type: string, minLength: 1, maxLength: 100}
        archived: {type: boolean}
        content: {$ref: '#/components/schemas/PhysicalRewardContent'}
