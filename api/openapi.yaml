  /api/v1/exchange/rewards/{id}/valuation:
    get:
      operationId: exchangeRewardValuation
      summary: Site administrator preview of saved reward contents at raw Jita 4-4 midpoint
      description: Includes hulls, fitting item quantities and extras per pack. Both buy and sell quotes are required for every type. No write; ignores the market appraisal ratio. Complete pack total is rounded up to whole ISK. Permission and reward version are checked before and after pricing. Save the reviewed amount through rewards/items with the same offer version.
      security: [{ SessionCookie: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, pattern: '^[1-9][0-9]*$' } }
        - { in: query, name: version, required: true, schema: { type: string, pattern: '^[1-9][0-9]*$' } }
      responses:
        '200':
          description: Preview; complete=false and isk_value=0 when any quote is missing, never a usable zero-price offer. Administrators may enter a manual value through rewards/items.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    required: [version, isk_value, mid, complete, missing_types, observed_at]
                    properties:
                      version: { type: string }
                      isk_value: { type: integer, format: int64, minimum: 0, maximum: 1000000000000 }
                      mid: { type: string, description: Raw pack midpoint before whole-ISK rounding; partial subtotal when incomplete. }
                      complete: { type: boolean }
                      missing_types: { type: integer, minimum: 0 }
                      observed_at: { type: string, nullable: true, format: date-time, description: Oldest available quote observation time. }
        '400': { description: Invalid ID, version, saved quantities or price range. }
        '401': { description: Session required. }
        '404': { description: Missing reward or current site administrator access. }
        '409': { description: Archived reward or version changed; reload configuration. }
        '503': { description: Market module or price service unavailable. }
