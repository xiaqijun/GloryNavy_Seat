        operation_id: {type: string, format: uuid}
        account_id: {type: string, format: uuid}
        key_id: {type: string}
        price_version: {type: string, description: Seat-local frozen pricing policy version returned with the grant.}
        unit_seconds: {type: integer, format: int64, minimum: 1, description: Seat-local frozen pricing unit; not sent to Sentry v2.}
