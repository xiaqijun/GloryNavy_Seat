    WelfareCommand:
      {"type":"object","properties":{"action":{"type":"string","enum":["configure","profile","apply","resubmit","approve","information","external","reject","cancel","execute","complete","grant","reverse","void","link_delivery","appraise","request_cancel","approve_cancel","reject_cancel","release_coins"]},"request_key":{"type":"string","format":"uuid"},"id":{"type":"string","pattern":"^[0-9]+$"},"corporation_id":{"type":"string","pattern":"^[0-9]+$"},"kind":{"oneOf":[{"type":"string","enum":["srp","alliance","solo","growth_gila","growth_ishtar","growth_loki","growth_absolution","capital","supercarrier","titan","grant"]},{"type":"string","pattern":"^growth_fitting_[1-9][0-9]*$"},{"type":"string","pattern":"^activity_[1-9][0-9]*$"}]},"version":{"type":"string","pattern":"^[0-9]+$"},"account_id":{"type":"string","format":"uuid"},"note":{"type":"string","maxLength":1000},"token":{"type":"string"},"config":{"$ref":"#/components/schemas/WelfareConfig"},"profile":{"$ref":"#/components/schemas/WelfareProfile"},"detail":{"$ref":"#/components/schemas/WelfareDetail"},"lines":{"type":"array","items":{"$ref":"#/components/schemas/WelfareGrantLine"},"maxItems":100},"delivery":{"$ref":"#/components/schemas/WelfareDeliverySelection"},"manual_pricing":{"type":"boolean","default":false,"description":"PVP approval only: explicitly select manual pricing and supply a reason in note. Original quote is retained."},"loss_policy_version":{"type":"string","pattern":"^[0-9]+$","description":"Loss approval: version of the displayed policy (0 if absent). Changed version returns 409; server always calculates using its own settings."},"confirmed_not_delivered":{"type":"boolean","default":false,"description":"approve_cancel only: explicit in-game confirmation of no payment and voided payment contracts; cached absence alone is insufficient."}},"required":["action","request_key"],"additionalProperties":false,"description":"Typed welfare command. configure/profile/grant/reverse require current site administrator. Other management actions require corporation.welfare and object scope; applicants cannot approve/execute/complete their own request. apply/configure/profile/grant require id=0 or omitted; other actions require id and current version. Amounts are integer hundredths; fixed policy rates are calculated server-side. grant requires a matching preview token and reason; reverse is a full remaining grant reversal. void only releases an approved, not executing, case. Unknown fields rejected; payload <=64 KiB. New alliance loss and ordinary capital applications (action=apply, kind=alliance or capital) are paused and rejected with 400. Historical case operations remain supported. link_delivery requires current site administrator plus case/contract object access; srp/solo/supercarrier/titan approved or executing only, no self-confirmation. A content token binds reviewed terms. Linked cases cannot use manual complete; only verified finished contracts complete them. Contract IDs are exclusively reserved across cases. New solo applications persist valuation.state=pending and enqueue appraisal in the same transaction; the save response does not wait for market or purchase-contract quotes. A welfare worker appraises asynchronously and a periodic scan recovers pending cases. Approval still requires a complete quote or explicit manual pricing. appraise refreshes a pending solo case for its owner or scoped welfare staff, under binding/version/replay guards. Quotes run before the transaction. PVP approval needs a complete stored quote with matching base_minor, or explicit manual_pricing and reason. Missing/partial/mismatched quotes return 409 welfare_valuation_required. Provided purchase contract takes precedence without market fallback; otherwise one hull and all killmail items use configured Jita midpoint ratio. Client valuation fields are ignored. Growth physical fulfillment now uses automatic exact-snapshot contract matching; configured coins credit atomically at settlement. New coin-only approvals credit immediately. Configuration is administrator-only. No automatic historical awards or game contract creation. Supercarrier/titan apply requires only detail.contract_id: a finished authorized personal purchase containing one eligible hull. Server derives character/hull/base, snapshots purchase and rechecks terms at approval. Rates use detail.rule.subsidy_rate_bps (1–10000); omitted legacy values default to 10%/5%. Invalid purchase returns 409 welfare_purchase_required. Pending account/category or purchase duplicates are denied; valid binding is required; manual verified/unused registration is not. Previously used history still blocks eligibility. Subsidy delivery requires issuer-funded item_exchange with price=0, reward equal to award, no requested goods, matching corporation/recipient and post-application issue time. Manual complete is disabled; ESI finished evidence is mandatory. Old pending requests without purchase evidence require reapplication. Current srp/solo delivery overrides the legacy manual description: execute/void/complete/link_delivery are rejected. Shared River scans approved/executing reimbursements and matches the exact persisted case reference description (Goose 41 SRP/PVP-UTC YYYYMMDD-UUID or legacy GNV-WF-case-number) in the recipient personal cache. It requires a currently bound authorized issuer, matching corporation and recipient, post-application issue time, price=0, reward exactly equal to award_minor, no requested items, and complete evidence. Only finished with matching acceptor completes the case. Ambiguous, changed or globally claimed contracts never complete it. Approval and issuer permissions are rechecked; no game contracts are created. Goose 42: request_cancel is owner-only for approved/executing srp/solo, entering cancel_requested. approve_cancel/reject_cancel require scoped welfare management and a different account. All three require note and current version. Approval requires confirmed_not_delivered=true and checks cached contracts under the same fence as payment settlement; live/completed/unknown/truncated/missing linked evidence returns 409 welfare_cancellation_payment. Only cancelled/deleted/rejected are safe. Approval releases KM entitlement only and keeps all delivery claims. Rejection restores approved/executing. River continues checking cancel_requested; finished payment takes precedence. No direct cancellation of game contracts. Current unified flow extends these cancellation commands to growth and supercarrier/titan. All release entitlement and purchase claims but preserve delivery reservations. These kinds reject execute/void/complete; new capital approvals also reject manual linking. Growth matches exact frozen physical contents with zero price/reward through the shared exchange matcher; attached coins credit atomically only once. New coin-only growth completes at approval. release_coins explicitly settles legacy approved/executing coin-only growth with non-self management permission and active binding, id/version/request_key/note. snapshot_required, coins_review_required and coins_credited are additional payment_status values. Legacy already-linked evidence remains checked. No migration beyond Goose 42."}
