  /api/v1/sentry/keys:
    get:
      operationId: sentryListKeys
      summary: List the current account's EVE Sentry client keys
      description: Returns only prefixes and lifecycle metadata. Plaintext secrets are never returned after creation.
      security: [{SessionCookie: []}]
      responses:
        '200':
          description: Authorized local key list
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/SentryKeyList'}
        '401': {description: No active session}
        '503': {description: Storage unavailable}
    post:
      operationId: sentryCreateKey
      summary: Request an EVE Sentry monitoring or alert key
      description: Generates the secret server-side, stores only its SHA-256 digest, and displays plaintext once after remote confirmation. Remote provisioning requires the server-only Sentry integration configuration.
      security: [{SessionCookie: []}]
      parameters:
        - {$ref: '#/components/parameters/CSRFToken'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SentryKeyCreate'}
      responses:
        '201':
          description: Key created; plaintext is included only in this response
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/SentryKey'}
        '400': {description: Invalid name, permissions, or request key}
        '401': {description: No active session}
        '409': {description: Request already belongs to another operation or key state changed}
        '503': {description: Remote Sentry integration is not configured or unavailable}
  /api/v1/sentry/keys/{id}:
    delete:
      operationId: sentryRevokeKey
      summary: Revoke the current account's EVE Sentry key
      security: [{SessionCookie: []}]
      parameters:
        - {$ref: '#/components/parameters/CSRFToken'}
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Revocation accepted and confirmed
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [revoked]
                    properties: {revoked: {type: boolean, enum: [true]}}
        '401': {description: No active session}
        '404': {description: Key not found or not owned by the current account}
        '409': {description: Key is already revoked or another operation is active}
        '503': {description: Remote Sentry integration is unavailable}
  /api/v1/sentry/alert-usage:
    get:
      operationId: sentryReadAlertUsage
      summary: Read the current account's alert coin balance summary
      description: Returns the exchange-owned Nutshell Coin accounting projection. Seconds explain the frozen pricing basis; they are not a separate quota or balance.
