  /api/v1/welfare/activity/projects:
    post:
      operationId: saveWelfareActivityProject
      summary: Site administrator creates or versions an activity benefit project within an authorized corporation
      description: Select one current reward-library snapshot (fittings/items/PLEX/ISK) and optionally a separate coin amount; coin-only projects are allowed. claim_limit sets the maximum number of claim batches per bound character for this project, with 0 meaning unlimited. Saved project edits never alter submitted case snapshots. request_key is idempotent; project_id=0 creates a new activity_<id> kind.
