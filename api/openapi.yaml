openapi: 3.0.3
info:
  title: GloryNavy API
  version: 0.1.0
  description: Operational endpoints, EVE SSO and SeAT-style corporation authorization. EVE credentials and tokens are never returned to the browser. Business endpoints accept the optional Accept-Language header (zh-CN or en; regional variants and q weights supported; default zh-CN) and return Content-Language plus Vary Accept-Language. This selects registered messages, generated summaries and local SDE display names only. User content, IDs, exact amounts, audit evidence, content tokens and ESI cache keys do not change. Private responses remain no-store.
servers:
  - url: /
paths:
  /api/v1/eve/public/activity:
    get:
      operationId: evePublicActivity
      security: []
      summary: Fixed Glory Navy public combat and aggregate online characters
      description: No target parameters. Corporation 98530802 only. Public zKillboard participation statistics plus user-authorized anonymous counts of currently bound corporation characters with valid online samples. Multiboxed characters count separately; no names, IDs, positions or individual states. Sources fail independently to null. Online has no stale fallback; combat retains stale snapshots. HTTP no-store. No authenticated ESI requests on public reads.
      responses:
        '200':
          description: Independent source availability; missing observations are not fabricated zeros.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  request_id: {type: string}
                  data:
                    type: object
                    additionalProperties: false
                    required: [corporation_id, combat, online]
                    properties:
                      corporation_id: {type: integer, enum: [98530802]}
                      combat:
                        type: object
                        nullable: true
                        additionalProperties: false
                        required: [months, updated_at, stale]
                        properties:
                          updated_at: {type: string, format: date-time}
                          stale: {type: boolean}
                          months:
                            type: array
                            minItems: 6
                            maxItems: 6
                            items:
                              type: object
                              additionalProperties: false
                              required: [month, kills, value]
                              properties:
                                month: {type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$'}
                                kills: {type: integer, minimum: 0, nullable: true}
                                value: {type: number, minimum: 0, nullable: true, description: zKillboard estimated ISK value}
                      online:
                        type: object
                        nullable: true
                        additionalProperties: false
                        required: [characters, covered_characters, bound_characters, updated_at, expires_at]
                        properties:
                          characters: {type: integer, minimum: 0, nullable: true, description: Online characters among valid samples; null when no samples}
                          covered_characters: {type: integer, minimum: 0}
                          bound_characters: {type: integer, minimum: 0}
                          updated_at: {type: string, format: date-time}
                          expires_at: {type: string, format: date-time}
  /api/v1/eve/public/corporation:
    {"get":{"operationId":"evePublicCorporation","summary":"Fixed Glory Navy public ESI profile; no member credentials or private data","security":[],"description":"No target parameters. Whitelisted official character count, founding date and alliance profile/count. Shared ESI cache/rate limits and coalesced refresh. Cached snapshot survives refresh errors with stale=true; initial failure returns 503.","responses":{"200":{"description":"Public projection; member_count counts game characters, not people.","content":{"application/json":{"schema":{"type":"object","required":["data"],"properties":{"data":{"type":"object","additionalProperties":false,"required":["corporation_id","name","ticker","member_count","date_founded","updated_at","stale"],"properties":{"corporation_id":{"type":"integer","enum":[98530802]},"name":{"type":"string"},"ticker":{"type":"string"},"member_count":{"type":"integer","minimum":0},"date_founded":{"type":"string","format":"date-time"},"alliance":{"type":"object","additionalProperties":false,"required":["id","name","ticker","corporation_count"],"properties":{"id":{"type":"integer","format":"int64","minimum":1},"name":{"type":"string"},"ticker":{"type":"string"},"corporation_count":{"type":"integer","minimum":0,"nullable":true}}},"updated_at":{"type":"string","format":"date-time"},"stale":{"type":"boolean"}}},"request_id":{"type":"string"}}}}}},"503":{"description":"public_profile_unavailable; no fabricated zero or raw upstream errors."}}}}
  /api/v1/attendance/pap-requirement:
    {"get":{"operationId":"attendancePAPRequirement","summary":"Alliance PAP monthly requirement per site account (all bound characters)","description":"This policy applies only to PAP imported from the alliance source. Local activity roll calls are corporation PAP and are statistics only. The current default is 3 alliance PAP per natural person per Asia/Shanghai calendar month; the source is returned explicitly as alliance. Readable to authenticated members. can_manage is derived from current site administrator status.","security":[{"SessionCookie":[]}],"responses":{"200":{"description":"Current policy","content":{"application/json":{"schema":{"type":"object","properties":{"data":{"type":"object","required":["source","monthly_points","version","can_manage"],"properties":{"source":{"type":"string","enum":["alliance"]},"monthly_points":{"type":"integer","minimum":1,"maximum":100000,"default":3},"version":{"type":"string","pattern":"^[1-9][0-9]*$"},"can_manage":{"type":"boolean"}}}},"required":["data"]}}}},"401":{"description":"No active session"},"503":{"description":"Service unavailable"}}},"post":{"operationId":"setAttendancePAPRequirement","summary":"Current site administrator updates the monthly requirement with optimistic concurrency and audit","description":"Applies immediately to alliance PAP requirement displays; it does not issue/revoke local corporation PAP, alter coin balances or deny welfare. Same-value current-version save makes no change.","security":[{"SessionCookie":[]}],"parameters":[{"in":"header","name":"X-CSRF-Token","required":true,"schema":{"type":"string"}}],"requestBody":{"required":true,"content":{"application/json":{"schema":{"type":"object","additionalProperties":false,"required":["monthly_points","version"],"properties":{"monthly_points":{"type":"integer","minimum":1,"maximum":100000,"default":3},"version":{"type":"string","pattern":"^[1-9][0-9]*$"}}}}}},"responses":{"200":{"description":"Saved","content":{"application/json":{"schema":{"type":"object","properties":{"data":{"type":"object","properties":{"saved":{"type":"boolean"}}}}}}}},"400":{"description":"Invalid version or points"},"401":{"description":"No active session"},"403":{"description":"CSRF check failed"},"404":{"description":"Not a current site administrator"},"409":{"description":"Policy version changed; reload"},"503":{"description":"Service unavailable"}}}}
  /api/v1/approval/context:
    {"get":{"operationId":"approvalContext","summary":"Current authorized management sources and member/corporation filters; grants no new permissions","security":[{"SessionCookie":[]}],"responses":{"200":{"description":"Authorized local read","content":{"application/json":{"schema":{"type":"object","required":["data"],"properties":{"data":{"$ref":"#/components/schemas/ApprovalContext"}}}}}},"400":{"description":"Invalid query, cursor or filters"},"401":{"description":"No active session"},"404":{"description":"No management scope or target not available"},"503":{"description":"Service unavailable"}}}}
  /api/v1/approval/items:
    {"get":{"operationId":"approvalQueue","summary":"Permission-filtered source records with complete source counts and stable merged keyset pagination","description":"No ESI requests or writes. Excludes own actionable tasks. A partial source failure reports unavailable and suppresses next_cursor. History is one record per source case, with its latest handling action and current state. mine filters human actions. Disabled sources are not registered.","security":[{"SessionCookie":[]}],"parameters":[{"name":"view","in":"query","schema":{"type":"string","enum":["pending","information","fulfillment","exceptions","history"],"default":"pending"}},{"name":"kind","in":"query","schema":{"type":"string"}},{"name":"corporation","in":"query","schema":{"type":"string"}},{"name":"account","in":"query","schema":{"type":"string"}},{"name":"q","in":"query","schema":{"type":"string"}},{"name":"status","in":"query","schema":{"type":"string"}},{"name":"cursor","in":"query","schema":{"type":"string"}},{"name":"from","in":"query","schema":{"type":"string","format":"date-time","description":"Inclusive"}},{"name":"until","in":"query","schema":{"type":"string","format":"date-time","description":"Exclusive"}},{"name":"mine","in":"query","schema":{"type":"boolean","default":false}}],"responses":{"200":{"description":"Authorized local read","content":{"application/json":{"schema":{"type":"object","required":["data"],"properties":{"data":{"$ref":"#/components/schemas/ApprovalQueue"}}}}}},"400":{"description":"Invalid query, cursor or filters"},"401":{"description":"No active session"},"404":{"description":"No management scope or target not available"},"503":{"description":"Service unavailable"}}}}
  /api/v1/approval/items/{source}/{id}:
    {"get":{"operationId":"approvalDetail","summary":"Reauthorize and read one source record; original module APIs retain all mutations","security":[{"SessionCookie":[]}],"parameters":[{"name":"source","in":"path","required":true,"schema":{"type":"string","enum":["welfare","exchange"]}},{"name":"id","in":"path","required":true,"schema":{"type":"string","pattern":"^[1-9][0-9]*$"}}],"responses":{"200":{"description":"Authorized local read","content":{"application/json":{"schema":{"type":"object","required":["data"],"properties":{"data":{"$ref":"#/components/schemas/ApprovalItem"}}}}}},"400":{"description":"Invalid query, cursor or filters"},"401":{"description":"No active session"},"404":{"description":"No management scope or target not available"},"503":{"description":"Service unavailable"}}}}
  /api/v1/market/settings:
    {"get":{"operationId":"marketSettings","summary":"Global appraisal ratio and administrator flag","security":[{"SessionCookie":[]}],"responses":{"200":{"description":"Success; estimates are references, not payments. Partial results carry complete=false.","content":{"application/json":{"schema":{"type":"object","properties":{"data":{"type":"object","properties":{"settings":{"type":"object","additionalProperties":false,"properties":{"ratio_bps":{"type":"integer","minimum":0,"maximum":100000},"version":{"type":"integer","minimum":1}},"required":["ratio_bps","version"]},"administrator":{"type":"boolean"}},"required":["settings","administrator"]}},"required":["data"]}}}},"401":{"description":"No session"},"403":{"description":"Capability/profile/CSRF rejected; settings write requires current administrator"},"503":{"description":"Service unavailable"}}},"post":{"operationId":"marketConfigure","summary":"Administrator saves global ratio; versioned audited transaction","security":[{"SessionCookie":[]}],"responses":{"200":{"description":"Success; estimates are references, not payments. Partial results carry complete=false.","content":{"application/json":{"schema":{"type":"object","properties":{"data":{"type":"object","additionalProperties":false,"properties":{"ratio_bps":{"type":"integer","minimum":0,"maximum":100000},"version":{"type":"integer","minimum":1}},"required":["ratio_bps","version"]}},"required":["data"]}}}},"400":{"description":"Invalid input"},"401":{"description":"No session"},"403":{"description":"Capability/profile/CSRF rejected; settings write requires current administrator"},"409":{"description":"Settings version changed"},"503":{"description":"Service unavailable"}},"parameters":[{"name":"X-CSRF-Token","in":"header","required":true,"schema":{"type":"string"}}],"requestBody":{"required":true,"content":{"application/json":{"schema":{"type":"object","additionalProperties":false,"properties":{"ratio_bps":{"type":"integer","minimum":0,"maximum":100000},"version":{"type":"integer","minimum":1}},"required":["ratio_bps","version"]}}}}}}
  /api/v1/market/estimate-contract:
    {"post": {"operationId": "marketEstimateContract", "summary": "Appraise one side of an accessible, outstanding and unexpired local item contract; no game writes", "security": [{"SessionCookie": []}], "responses": {"200": {"description": "Success; estimates are references, not payments. Partial results carry complete=false.", "content": {"application/json": {"schema": {"type": "object", "properties": {"data": {"type": "object", "properties": {"lines": {"type": "array", "maxItems": 2001, "items": {"type": "object", "properties": {"input": {"type": "string"}, "name": {"type": "string"}, "quantity": {"type": "string", "pattern": "^[0-9]+$"}, "type_id": {"type": "string", "pattern": "^[0-9]+$"}, "status": {"enum": ["ready", "invalid_quantity", "unknown_type", "unavailable", "missing_orders"]}, "buy": {"type": ["string", "null"], "pattern": "^[0-9]+\\.[0-9]{2}$"}, "mid": {"type": ["string", "null"], "pattern": "^[0-9]+\\.[0-9]{2}$"}, "sell": {"type": ["string", "null"], "pattern": "^[0-9]+\\.[0-9]{2}$"}, "observed_at": {"type": ["string", "null"], "format": "date-time"}}, "required": ["input", "name", "quantity", "type_id", "status", "buy", "mid", "sell", "observed_at"]}}, "totals": {"type": "object", "properties": {"buy": {"type": "string", "pattern": "^[0-9]+\\.[0-9]{2}$"}, "mid": {"type": "string", "pattern": "^[0-9]+\\.[0-9]{2}$"}, "sell": {"type": "string", "pattern": "^[0-9]+\\.[0-9]{2}$"}}, "required": ["buy", "mid", "sell"]}, "adjusted": {"type": "object", "properties": {"buy": {"type": "string", "pattern": "^[0-9]+\\.[0-9]{2}$"}, "mid": {"type": "string", "pattern": "^[0-9]+\\.[0-9]{2}$"}, "sell": {"type": "string", "pattern": "^[0-9]+\\.[0-9]{2}$"}}, "required": ["buy", "mid", "sell"]}, "ratio_bps": {"type": "integer"}, "complete": {"type": "boolean"}}, "required": ["lines", "totals", "adjusted", "ratio_bps", "complete"]}}, "required": ["data"]}}}}, "400": {"description": "Invalid input"}, "401": {"description": "No session"}, "403": {"description": "Capability/profile/CSRF rejected; settings write requires current administrator"}, "503": {"description": "Service unavailable"}, "404": {"description": "Contract missing, outside scope, inactive binding or access revoked"}, "409": {"description": "Contract not eligible, items incomplete, unsupported item quantities/copies, or terms changed during appraisal"}}, "parameters": [{"name": "X-CSRF-Token", "in": "header", "required": true, "schema": {"type": "string"}}], "requestBody": {"required": true, "content": {"application/json": {"schema": {"type": "object", "additionalProperties": false, "required": ["owner_kind", "owner_id", "contract_id", "side"], "properties": {"owner_kind": {"type": "string", "enum": ["character", "corporation"]}, "owner_id": {"type": "string", "pattern": "^[1-9][0-9]*$"}, "contract_id": {"type": "string", "pattern": "^[1-9][0-9]*$"}, "side": {"type": "string", "enum": ["included", "requested"]}}}}}}, "description": "Requires market.self and the existing current personal/corporation contract object guard. Reads all synchronized item rows by type ID. Checks access and terms again after quotes. Rejects incomplete items, blueprint copies, empty side, excessive quantity or more than 2001 rows. Uses the same Jita 4-4 ratio and cache as pasted-list appraisals."}}
  /api/v1/market/estimate:
    {"post":{"operationId":"marketEstimate","summary":"Jita 4-4 pasted item list: top buy/sell and midpoint, shared ratio, 25-second budget","security":[{"SessionCookie":[]}],"responses":{"200":{"description":"Success; estimates are references, not payments. Partial results carry complete=false.","content":{"application/json":{"schema":{"type":"object","properties":{"data":{"type":"object","properties":{"lines":{"type":"array","maxItems":100,"items":{"type":"object","properties":{"input":{"type":"string"},"name":{"type":"string"},"quantity":{"type":"string","pattern":"^[0-9]+$"},"type_id":{"type":"string","pattern":"^[0-9]+$"},"status":{"enum":["ready","invalid_quantity","unknown_type","unavailable","missing_orders"]},"buy":{"type":["string","null"],"pattern":"^[0-9]+\\.[0-9]{2}$"},"mid":{"type":["string","null"],"pattern":"^[0-9]+\\.[0-9]{2}$"},"sell":{"type":["string","null"],"pattern":"^[0-9]+\\.[0-9]{2}$"},"observed_at":{"type":["string","null"],"format":"date-time"}},"required":["input","name","quantity","type_id","status","buy","mid","sell","observed_at"]}},"totals":{"type":"object","properties":{"buy":{"type":"string","pattern":"^[0-9]+\\.[0-9]{2}$"},"mid":{"type":"string","pattern":"^[0-9]+\\.[0-9]{2}$"},"sell":{"type":"string","pattern":"^[0-9]+\\.[0-9]{2}$"}},"required":["buy","mid","sell"]},"adjusted":{"type":"object","properties":{"buy":{"type":"string","pattern":"^[0-9]+\\.[0-9]{2}$"},"mid":{"type":"string","pattern":"^[0-9]+\\.[0-9]{2}$"},"sell":{"type":"string","pattern":"^[0-9]+\\.[0-9]{2}$"}},"required":["buy","mid","sell"]},"ratio_bps":{"type":"integer"},"complete":{"type":"boolean"}},"required":["lines","totals","adjusted","ratio_bps","complete"]}},"required":["data"]}}}},"400":{"description":"Invalid input"},"401":{"description":"No session"},"403":{"description":"Capability/profile/CSRF rejected; settings write requires current administrator"},"503":{"description":"Service unavailable"}},"parameters":[{"name":"X-CSRF-Token","in":"header","required":true,"schema":{"type":"string"}}],"requestBody":{"required":true,"content":{"application/json":{"schema":{"type":"object","additionalProperties":false,"properties":{"text":{"type":"string","minLength":1,"maxLength":32768}},"required":["text"]}}}}}}
  /api/v1/welfare/cases/{id}/contracts:
    {"get":{"operationId":"welfareDeliveryCandidates","summary":"Local contract recommendations or manual ID lookup; current site administrator and case/contract object permissions required","security":[{"SessionCookie":[]}],"parameters":[{"name":"id","in":"path","required":true,"schema":{"type":"string","pattern":"^[0-9]+$"}},{"name":"contract_id","in":"query","schema":{"type":"string","pattern":"^[0-9]+$"}}],"responses":{"200":{"description":"Eligible candidates, newest first; manual lookup may include a rejected candidate and reason. No mutation.","content":{"application/json":{"schema":{"type":"object","required":["data"],"properties":{"data":{"type":"object","required":["items"],"properties":{"items":{"type":"array","items":{"$ref":"#/components/schemas/WelfareDeliveryCandidate"}}}}}}}}},"400":{"description":"Invalid ID"},"401":{"description":"No session"},"404":{"description":"Unavailable case or permission denied"},"503":{"description":"Local evidence unavailable"}}}}
  /api/v1/wallet/context:
    {"get":{"operationId":"walletContext","summary":"Readable personal and corporation wallet owners; foreign member selection requires current site administrator","security":[{"SessionCookie":[]}],"parameters":[{"name":"member","in":"query","required":false,"schema":{"type":"string","format":"uuid"}}],"responses":{"200":{"description":"Local observations; no game payment or reimbursement mutation","content":{"application/json":{"schema":{"type":"object","required":["data"],"properties":{"data":{"type":"object","required":["owners"],"properties":{"owners":{"type":"array","items":{"$ref":"#/components/schemas/WalletOwner"}}}}}}}}},"400":{"description":"Invalid query"},"401":{"description":"No active session"},"403":{"description":"Profile or capability denied"},"404":{"description":"Owner, binding, scope or division unavailable"},"503":{"description":"Storage unavailable"}}}}
  /api/v1/wallet/summary:
    get:
      operationId: walletWorkbenchSummary
      summary: Current account's authorized character wallet balances and monthly income/expense in one local read
      description: Uses active bindings and wallet scopes; no member selector, no corporation wallets or ESI network request. The latest observed variant of each journal reference contributes once. Missing balance remains null.
      security: [{SessionCookie: []}]
      parameters:
        - name: from
          in: query
          required: true
          schema: {type: string, format: date-time}
          description: Inclusive current-month start with timezone, at most 45 days ago
      responses:
        '200':
          description: Authorized local summary; decimal ISK values and owner IDs are strings
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items:
                          type: object
                          required: [owner_id, balance, observed_at, income, expense]
                          properties:
                            owner_id: {type: string, pattern: '^[0-9]+$'}
                            balance: {type: string, nullable: true}
                            observed_at: {type: string, format: date-time, nullable: true}
                            income: {type: string}
                            expense: {type: string}
        '400': {description: Invalid month start}
        '401': {description: No active session}
        '403': {description: Profile or capability denied}
        '503': {description: Storage unavailable}
  /api/v1/wallet/corporation-summary:
    get:
      operationId: walletCorporationSummary
      summary: Authorized corporation wallet balance and monthly income/expense
      description: Uses the selected corporation's readable wallet divisions and current local observations. Requires corporation journal and division capabilities; no member selector, game write, or ESI network request.
      security: [{SessionCookie: []}]
      parameters:
        - name: owner_id
          in: query
          required: true
          schema: {type: string, pattern: '^[1-9][0-9]*$'}
        - name: from
          in: query
          required: true
          schema: {type: string, format: date-time}
          description: Inclusive current-month start with timezone, at most 45 days ago
      responses:
        '200':
          description: Authorized local summary; decimal ISK values and owner ID are strings
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        maxItems: 1
                        items:
                          type: object
                          required: [owner_id, balance, observed_at, income, expense]
                          properties:
                            owner_id: {type: string, pattern: '^[0-9]+$'}
                            balance: {type: string, nullable: true}
                            observed_at: {type: string, format: date-time, nullable: true}
                            income: {type: string}
                            expense: {type: string}
        '400': {description: Invalid month start or corporation ID}
        '401': {description: No active session}
        '403': {description: Profile or capability denied}
        '404': {description: Corporation, wallet scope or authorized division unavailable}
        '503': {description: Storage unavailable}
  /api/v1/wallet/corporation-finance-trend:
    get:
      operationId: walletCorporationFinanceTrend
      summary: Authorized corporation wallet monthly finance trend
      description: Aggregates current local corporation journal snapshots by UTC calendar month, including tax and net change. Uses only the selected corporation's readable divisions and current credential owner hashes; no ESI network request.
      security: [{SessionCookie: []}]
      parameters:
        - name: owner_id
          in: query
          required: true
          schema: {type: string, pattern: '^[1-9][0-9]*$'}
        - name: from
          in: query
          required: true
          schema: {type: string, format: date-time}
        - name: until
          in: query
          required: true
          schema: {type: string, format: date-time}
          description: Exclusive end; cannot be in the future and the range cannot exceed 370 days
      responses:
        '200':
          description: Monthly income, spending, tax and net change; decimal ISK values are strings
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items:
                          type: object
                          required: [period, income, expense, tax, net]
                          properties:
                            period: {type: string, pattern: '^\\d{4}-\\d{2}$'}
                            income: {type: string}
                            expense: {type: string}
                            tax: {type: string}
                            net: {type: string}
        '400': {description: Invalid corporation ID or trend range}
        '401': {description: No active session}
        '403': {description: Profile or corporation wallet capability denied}
        '404': {description: Corporation, wallet scope or authorized division unavailable}
        '503': {description: Storage unavailable}
  /api/v1/wallet/personal-corporation-summary:
    get:
      operationId: walletPersonalCorporationSummary
      summary: Site administrator aggregate of member character wallets for one corporation
      description: Reads local snapshots for current bound characters in the selected corporation. Requires access.members.read; only matching owners, usable credentials and esi-wallet.read_character_wallet.v1 are included. No per-character detail or ESI request.
      security: [{SessionCookie: []}]
      parameters:
        - name: corporation_id
          in: query
          required: true
          schema: {type: string, pattern: '^[1-9][0-9]*$'}
        - name: from
          in: query
          required: true
          schema: {type: string, format: date-time}
          description: Inclusive current-month start with timezone, at most 45 days ago
      responses:
        '200':
          description: Corporation member aggregate; decimal ISK values and corporation ID are strings
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        maxItems: 1
                        items:
                          type: object
                          required: [owner_id, balance, observed_at, income, expense]
                          properties:
                            owner_id: {type: string, pattern: '^[0-9]+$'}
                            balance: {type: string, nullable: true}
                            observed_at: {type: string, format: date-time, nullable: true}
                            income: {type: string}
                            expense: {type: string}
        '400': {description: Invalid month start or corporation ID}
        '401': {description: No active session}
        '403': {description: Site administrator/member read capability required}
        '404': {description: Corporation member wallet scope or snapshots unavailable}
        '503': {description: Storage unavailable}
  /api/v1/wallet/personal-corporation-income-trend:
    get:
      operationId: walletPersonalCorporationIncomeTrend
      summary: Site administrator monthly income trend for bound corporation members
      description: Aggregates current local personal-wallet journal snapshots by UTC calendar month. Only currently bound characters with a matching owner hash, valid profile and esi-wallet.read_character_wallet.v1 are included. No ESI network request and no corporation wallet data.
      security: [{SessionCookie: []}]
      parameters:
        - name: corporation_id
          in: query
          required: true
          schema: {type: string, pattern: '^[1-9][0-9]*$'}
        - name: from
          in: query
          required: true
          schema: {type: string, format: date-time}
          description: Inclusive start; at most 370 days before until
        - name: until
          in: query
          required: true
          schema: {type: string, format: date-time}
          description: Exclusive end; cannot be in the future
      responses:
        '200':
          description: Monthly income and expense trend; decimal ISK values are strings
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items:
                          type: object
                          required: [period, income, expense, active_members]
                          properties:
                            period: {type: string, pattern: '^\\d{4}-\\d{2}$'}
                            income: {type: string}
                            expense: {type: string}
                            active_members: {type: integer, minimum: 0}
        '400': {description: Invalid range or corporation ID}
        '401': {description: No active session}
        '403': {description: Site administrator/member read capability required}
        '404': {description: Corporation member wallet scope or snapshots unavailable}
        '503': {description: Storage unavailable}
  /api/v1/wallet/records:
