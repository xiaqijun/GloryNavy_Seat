name: glorynavy-dev
services:
  db:
    image: postgres:18.6
    environment:
      POSTGRES_USER: glorynavy
      POSTGRES_PASSWORD: glorynavy_dev
      POSTGRES_DB: glorynavy
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U glorynavy -d glorynavy"]
      interval: 3s
      timeout: 3s
      retries: 20
    mem_limit: 1536m
volumes:
  pgdata:
