# Install after zz-glorynavy-seat.conf as zzz-glorynavy-seat-legacy.conf.
# The old DNS alias must also redirect in HTTP; never proxy authenticated writes.
server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name seat.kisectool.com;
    ssl_certificate /www/sites/seat.kisectool.com/tls/fullchain.pem;
    ssl_certificate_key /www/sites/seat.kisectool.com/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log /www/sites/zz-glorynavy-seat/log/access.log glorynavy_safe;
    error_log /www/sites/zz-glorynavy-seat/log/error.log;
    add_header Referrer-Policy no-referrer always;
    add_header Cache-Control no-store always;
    if ($request_method !~ ^(GET|HEAD)$) {
        return 303 https://seat.glorynavy.com/login;
    }
    location ^~ /.well-known/acme-challenge/ {
        root /www/sites/seat.kisectool.com/acme;
        default_type text/plain;
        try_files $uri =404;
    }
    # An in-progress old-host flow has a host-only cookie; start again and
    # discard its code/state rather than forwarding it to another origin.
    location = /api/v1/eve/callback {
        return 303 https://seat.glorynavy.com/login;
    }
    location / { return 301 https://seat.glorynavy.com$request_uri; }
}
