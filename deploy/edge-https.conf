# 1Panel website zz-glorynavy-seat; installed as conf.d/zz-glorynavy-seat.conf.
# /api/ is defined in this site's proxy/api.conf for the 1Panel reverse-proxy list.
# Do not log OAuth authorization codes, cookies, or query strings.
log_format glorynavy_safe '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent rt=$request_time uct=$upstream_connect_time uht=$upstream_header_time urt=$upstream_response_time';
include /www/sites/zz-glorynavy-seat/upstream/*.conf;
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name seat.kisectool.com;
    ssl_certificate /www/sites/zz-glorynavy-seat/ssl/fullchain.pem;
    ssl_certificate_key /www/sites/zz-glorynavy-seat/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-SHA384:ECDHE-RSA-AES128-SHA256:!aNULL:!eNULL:!EXPORT:!DSS:!DES:!RC4:!3DES:!MD5:!PSK:!KRB5:!SRP:!CAMELLIA:!SEED;
    ssl_session_cache shared:glorynavy_tls:10m;
    ssl_session_timeout 1d;
    # Keep the site's existing JS/CSS compression while also compressing
    # larger JSON API responses sent to browsers and the CDN.
    gzip_types text/plain application/javascript application/x-javascript text/javascript text/css application/xml application/json image/svg+xml;
    gzip_min_length 512;
    root /www/sites/zz-glorynavy-seat/index;
    index index.html;
    # Activity welfare accepts up to 3 screenshots (2 MiB each) in one
    # multipart request. Keep a little room for multipart headers while the
    # API enforces its stricter 7 MiB total limit.
    client_max_body_size 8m;
    access_log /www/sites/zz-glorynavy-seat/log/access.log glorynavy_safe;
    error_log /www/sites/zz-glorynavy-seat/log/error.log;
    add_header X-Content-Type-Options nosniff always;
    # Same-origin form POST must retain its Origin for strict CSRF validation.
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;

    include /www/sites/zz-glorynavy-seat/proxy/*.conf;
    location = /health/live { return 404; }
    location = /health/ready { return 404; }
    location ~ /\. { return 404; }
    location /assets/ {
        try_files $uri =404;
        expires 1y;
    }
    # Public artwork has stable names; revalidate daily instead of downloading
    # the ship and login images on every page visit.
    location /images/ {
        try_files $uri =404;
        expires 1d;
    }
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
    }
}
server {
    listen 80;
    listen [::]:80;
    server_name seat.kisectool.com;
    access_log /www/sites/zz-glorynavy-seat/log/access.log glorynavy_safe;
    error_log /www/sites/zz-glorynavy-seat/log/error.log;
    location ^~ /.well-known/acme-challenge/ {
        root /www/sites/seat.kisectool.com/acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://seat.kisectool.com$request_uri; }
}
