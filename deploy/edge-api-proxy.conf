# 1Panel website zz-glorynavy-seat reverse-proxy rule named api.
location ^~ /api/ {
    # OAuth callback URLs must not become referrers on subsequent navigation.
    # Defining headers here disables inheritance, so repeat all three.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    proxy_pass http://glorynavy_api;
    proxy_http_version 1.1;
    proxy_set_header Host seat.kisectool.com;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_hide_header Referrer-Policy;
    proxy_cache off;
}
