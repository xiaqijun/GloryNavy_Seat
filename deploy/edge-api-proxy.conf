# 1Panel website zz-glorynavy-seat reverse-proxy rules.
#
# Seat's Sentry integration client uses the same HTTPS origin as the web app,
# but these service-to-service paths belong to the EVE Sentry server on 114.
# Keep this prefix before the generic /api/ rule so reconciliation requests do
# not get sent back to Glory Navy Seat and return its 404 envelope.
location ^~ /api/v1/integrations/seat/ {
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    proxy_pass http://10.233.53.204:8765;
    proxy_http_version 1.1;
    proxy_set_header Host 114.132.167.239;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_hide_header Referrer-Policy;
    proxy_cache off;
}

location ^~ /api/ {
    # OAuth callback URLs must not become referrers on subsequent navigation.
    # Defining headers here disables inheritance, so repeat all three.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    proxy_pass http://glorynavy_api;
    proxy_http_version 1.1;
    proxy_set_header Host seat.kisectool.com;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_hide_header Referrer-Policy;
    proxy_cache off;
}
