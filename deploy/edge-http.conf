# Bootstrap ACME only. Replace with edge-https.conf after certificate and API checks.
server {
    listen 80;
    listen [::]:80;
    server_name seat.kisectool.com;
    access_log off;
    location ^~ /.well-known/acme-challenge/ {
        root /www/sites/seat.kisectool.com/acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 503; }
}
