# New-install HTTP bootstrap only; existing 1Panel deployments must not apply this.
server {
    listen 80;
    listen [::]:80;
    server_name seat.glorynavy.com;
    access_log off;
    location ^~ /.well-known/acme-challenge/ {
        root /www/sites/seat.kisectool.com/acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 503; }
}
